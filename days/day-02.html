<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 02 ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #111;
      color: #f8f4ef;
      font-family: system-ui, sans-serif;
    }
    .note {
      width: min(650px, 100%);
      text-align: center;
    }
    .note h1 {
      font-family: Georgia, serif;
      font-size: clamp(42px, 8vw, 76px);
      font-weight: 400;
      margin: 0 0 24px;
    }
    .note p {
      color: #b9b2ad;
      font-size: 18px;
      line-height: 1.8;
    }
    .heart {
      font-size: 50px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <main class="note">
    <div class="heart">♡</div>
    <h1>Day two.</h1>
    <p>
      This is deliberately a completely different layout. Replace this entire
      file with whatever you want: a photo essay, a video, a letter, a game,
      an audio recording, or something interactive.
    </p>
  </main>
</body>
</html>
